<h2>Q · 不就是卖曝光？</h2>
<p class="a">谈 sell-out 与可复用场景，对齐 demand-led。补的是跨品牌 OS，不是多买一次 KOL。</p>

<h2>Q · 有易建联还不够？</h2>
<p class="a">够美禄一季战役，不够咖啡日频，也不够把「难忘传播」变成可复制能力。</p>

<h2>Q · 和佳得乐冲突？</h2>
<p class="a">接口落在咖啡与运动零食，不碰电解质运动饮料主叙事。</p>

<h2>Q · Q2 已 +2% 还急？</h2>

<p class="a">冷启动不报价。先认方向与试验边界。</p>
