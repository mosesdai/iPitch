# Stage-2 / v1.6 aligned gates.
# Hard mins keep demo runnable; soft_target encodes 香飘飘厚度取向 (WARN, not RED).
# Lobby gold (byd / geely-international) uses --lobby-floor — RED on missing rails.

min_chars:
  research_total: 400
  ifalsify: 200
  knife: 200
  one_pager: 300
  primary: 200
  max_gap: 150

# Soft orientation (playbook v1.6 §四). Reported on passport; fails only if soft_fail: true
soft_chars:
  research_total: 12000   # L7: raise soft floor toward 香飘飘 / lobby gold
soft_fail: false

citation:
  min_count: 1

required_files:
  research:
    - research/README.md
    - research/01_IR_financial.md
    - research/09_not_for_pitch.md
  ifalsify:
    - ifalsify_report.md
  compose:
    - ONE_PAGER.md
    - PRIMARY_REQUIRED.md
    - MAX_GAP_AUDIT.md
    - html/index.html
  knife:
    - B_knife.md

# L7 · lobby gold profile (checked by --lobby-floor; not demo RED)
lobby_required:
  - ONE_PAGER.md
  - B_knife.md
  - A_dossier.md
  - ifalsify_report.md
  - PRIMARY_REQUIRED.md
  - MAX_GAP_AUDIT.md
  - data_traceability.md
lobby_min_research_files: 8
lobby_min_disruptive_concepts: 2
lobby_require_portable_html: true
lobby_soft_research_chars: 20000

allowed_prefixes:
  - research/
  - B_knife.md
  - ifalsify_report.md
  - 00_charter.md
  - ONE_PAGER.md
  - PRIMARY_REQUIRED.md
  - MAX_GAP_AUDIT.md
  - html/
  - deliver/
  - pitchvision/
  - R2_evolved_report.md
  - R2_shelf_recommendations.md
  - R3_close_pack.md
